<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Advertisement Fraud Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Job Advertisement Fraud Detection</h3>
                    </div>
                    <div class="card-body">
                        <p class="lead">Detect fraudulent job postings using Machine Learning</p>
                        
                        <div class="d-grid gap-2 mt-4">
                            <a href="{{ url_for('predict_form') }}" class="btn btn-primary btn-lg">
                                Check Job Posting
                            </a>
                            <a href="{{ url_for('upload_pdf') }}" class="btn btn-secondary btn-lg">
                                Upload PDF for Analysis
                            </a>
                        </div>
                        
                        {% if current_user.is_authenticated %}
                        <div class="mt-4">
                            <a href="{{ url_for('profile') }}" class="btn btn-outline-primary">Profile</a>
                            <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Logout</a>
                        </div>
                        {% else %}
                        <div class="mt-4">
                            <a href="{{ url_for('login') }}" class="btn btn-outline-primary">Login</a>
                            <a href="{{ url_for('register') }}" class="btn btn-outline-success">Register</a>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
